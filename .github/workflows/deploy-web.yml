name: Build Web & Deploy to Vercel Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-dist-deploy
  cancel-in-progress: true

jobs:
  build-and-publish-web:
    name: Build Compose Wasm (Web) & Publish web-dist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Normalize gradlew line endings & permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Accept Android SDK licenses (for KMP Android plugin configuration)
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :composeApp:desktopTest --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=4

      - name: Build Web (Kotlin/Wasm) production bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=4

      - name: Attach Vercel configuration to bundle
        run: |
          cp vercel.json composeApp/build/dist/wasmJs/productionExecutable/vercel.json
          ls -la composeApp/build/dist/wasmJs/productionExecutable

      - name: Publish static bundle to web-dist branch (for Vercel)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web-dist
          publish_dir: composeApp/build/dist/wasmJs/productionExecutable
          force_orphan: true
          commit_message: "deploy(web): build from ${{ github.sha }}"
